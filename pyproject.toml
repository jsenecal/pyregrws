[project]
name = "pyregrws"
version = "1.0.0"
description = "Python library to retrieve and modify records within ARIN's database through their Reg-RWS service"
authors = [{ name = "Jonathan Senecal", email = "contact@jonathansenecal.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: Pydantic",
]
dependencies = [
  "requests>=2.28.1,<3",
  "pydantic>=2.0,<3",
  "pydantic-xml>=2.0,<3",
  "pydantic-settings[dotenv]>=2.0,<3",
  "certifi>=2026.0.0,<2027",
]

[project.urls]
Homepage = "https://github.com/jsenecal/pyregrws"

[dependency-groups]
dev = [
  "pytest-xdist>=3.7.0,<4",
  "ipython>=9.0.0,<10",
  "pytest==9.0.3",
  "xmldiff>=3,<4",
  "lxml>=6.0.0,<7",
  "pytest-cov>=7.0.0,<8",
  "responses>=0.25.0,<0.26",
  "ruff>=0.15.22,<0.16",
]

[tool.pytest.ini_options]

[tool.black]
line-length = 88
target_version = ['py310', 'py311']

[tool.isort]
profile = "black"

[tool.pylint]
max-line-length = 88

[tool.pyright]
reportGeneralTypeIssues = "information"

[tool.mypy]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.uv.build-backend]
module-name = "regrws"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
