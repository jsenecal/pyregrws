name: Release

# Keep this file named publish.yml: the PyPI trusted publisher for pyregrws is
# bound to this workflow filename and the `pypi` environment. Renaming either
# breaks publishing until the publisher is updated on PyPI.

on:
  release:
    types: [published]

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.ref }}
    # Reusable workflows do not inherit secrets from the caller
    secrets: inherit

  # PyPI does not accept a reusable workflow as a trusted publisher
  # (https://docs.pypi.org/trusted-publishers/troubleshooting/), so publishing
  # stays in this file.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/p/pyregrws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # The release tag is the source of truth for the version; pyproject.toml
      # only holds a placeholder. uv rejects a tag that isn't valid PEP 440.
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build
        run: uv build

      - name: Publish
        # `always` rather than the default `automatic`: without an ambient OIDC
        # token this must fail loudly, not fall back to looking for a password
        # that is deliberately not configured.
        run: uv publish --trusted-publishing always
